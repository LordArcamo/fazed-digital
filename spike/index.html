<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field spike</title>
<style>
  :root{--black:#090909;--pitch:24px;--ox:64px}
  html,body{margin:0;height:100%;background:var(--black);overflow:hidden}
  #poster{position:fixed;inset:0;background-image:radial-gradient(circle at center,#2A2A2A 1px,transparent 1.5px);
    background-size:var(--pitch) var(--pitch);background-position:calc(var(--ox) - var(--pitch)/2) 0}
  .mark{position:absolute;height:min(62vh,600px);aspect-ratio:755/1089;left:72%;top:52%;transform:translate(-50%,-50%);
    background-image:radial-gradient(circle at center,rgba(245,244,240,.55) 1.1px,transparent 1.6px);background-size:4px 4px;
    clip-path:url(#mk)}
  canvas{position:fixed;inset:0;width:100%;height:100%;opacity:0}
  .gl-live #poster{visibility:hidden}
  .gl-live canvas{opacity:1}
  #hud{position:fixed;left:8px;bottom:8px;color:#C9FF57;font:11px monospace;z-index:3;white-space:pre}
  .shotbox{position:absolute;left:8%;top:22%;width:44vw;aspect-ratio:16/10;outline:1px dashed #333}
</style></head>
<body>
<div id="poster"><div class="mark" id="markbox"></div></div>
<div class="shotbox" id="shotbox"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><clipPath id="mk" clipPathUnits="objectBoundingBox"><g id="mkpaths"></g></clipPath></svg>
<canvas id="c" aria-hidden="true"></canvas>
<div id="hud"></div>
<script type="module" src="./spike.ts"></script>
</body></html>
